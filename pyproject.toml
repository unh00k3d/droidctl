[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "droidctl"
version = "0.1.0.dev1"
description = "An agent-first Android automation CLI: compact UI snapshots with refs and element-based actions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Enes Bayram" }]
# Everything a `pipx install` needs, so `droidctl setup` is the only other step:
# adbutils also brings an `adb` binary for machines without platform-tools, Pillow
# is for screenshots on Android < 11 and `shot --marks`, mcp for `droidctl mcp`.
dependencies = [
    "adbutils>=2.8",
    "rich>=13",
    "pillow>=10",
    "mcp>=2.2",
    # the iPhone sign-in without Xcode (ios/apple): GSA crypto and a CA store for python.org builds
    "cryptography>=42",
    "certifi",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["build", "pytest>=7"]
# kept so `pip install 'droidctl[mcp]'` still works; the MCP SDK is a regular dependency now
mcp = []

[project.scripts]
droidctl = "droidctl.client:entry"

[tool.setuptools]
packages = ["droidctl", "droidctl.assets", "droidctl.ios", "droidctl.ios.apple"]

[tool.setuptools.package-data]
# the agent APK (`make apk`) and the prebuilt iOS runner (`make runner`), both committed, ship inside the wheel
droidctl = ["SKILL.md"]
"droidctl.assets" = ["*.apk", "*.zip"]
"droidctl.ios.apple" = ["*.pem"]
# the iOS runner's Xcode project: built on the user's Mac with their signing team (`droidctl setup`)
"droidctl.ios" = ["xcode/DroidctlRunner.xcodeproj/project.pbxproj",
                  "xcode/DroidctlRunner.xcodeproj/xcshareddata/xcschemes/*.xcscheme",
                  "xcode/DroidctlRunner/*.m"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# device tests skip unless DROIDCTL_SERIAL is set, so a bare `pytest` is always safe
addopts = "-q"
