[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "droidctl"
version = "0.1.0.dev0"
description = "An agent-first Android automation CLI: compact UI snapshots with refs and element-based actions."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Enes Bayram" }]
dependencies = [
    "adbutils>=2.8",
    "rich>=13",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["build", "pytest>=7"]
# `droidctl mcp`: the official MCP SDK (a resident process, so its import cost is paid once)
mcp = ["mcp>=2.2"]

[project.scripts]
droidctl = "droidctl.client:entry"

[tool.setuptools]
packages = ["droidctl", "droidctl.assets"]

[tool.setuptools.package-data]
# the agent APK is built by `make apk` (not committed) and shipped inside the wheel
droidctl = ["SKILL.md"]
"droidctl.assets" = ["*.apk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# device tests skip unless DROIDCTL_SERIAL is set, so a bare `pytest` is always safe
addopts = "-q"
